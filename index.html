<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>🎡 돌림판 ㅡ 행복해봄봄</title>
	
	<!-- Bootstrap v5.3.3 Dist -->
	<link href="/assets/Bootstrap/css/bootstrap.css" rel="stylesheet">
	<script src="/assets/Bootstrap/js/bootstrap.js"></script>
	
	<script>
		window.onload = () => {
			setupWheel();
		};
	</script>
	
	<style>
		@font-face {
			font-family: 'SB_Gothic';
			src: url('/assets/fonts/SB_Gothic.ttf') format('truetype');
		}
		body {
			font-family: SB_Gothic;
			background:
				linear-gradient(rgba(255,255,255,0.6), rgba(255,255,255,0.6)),
				url('/assets/img/spring_blossom_1.jpg') no-repeat center center fixed;
			background-size: cover;
		}

		@keyframes fadeInScale {
			from { opacity: 0; transform: scale(0.6); }
			to   { opacity: 1; transform: scale(1); }
		}
		.wheel-result-anim { animation: fadeInScale 0.45s ease-out; }

		/* 결과 모달 팝 애니메이션 */
		@keyframes resultPop {
			0%   { transform: scale(0.2) rotate(-5deg); opacity: 0; }
			60%  { transform: scale(1.08) rotate(2deg);  opacity: 1; }
			80%  { transform: scale(0.96) rotate(-1deg); }
			100% { transform: scale(1)    rotate(0deg);  opacity: 1; }
		}
		#resultModal .modal-dialog { transition: none; }
		#resultModal.show .modal-dialog {
			animation: resultPop 0.52s cubic-bezier(0.34, 1.56, 0.64, 1) both;
		}
		#resultModal .modal-content {
			border-radius: 24px;
			overflow: hidden;
			border: none;
			box-shadow: 0 16px 48px rgba(0,0,0,.45);
		}

		/* 판 + 가운데 화살표 */
		.wheel-wrap {
			position: relative;
			width: min(600px, 92vw);
			aspect-ratio: 1;
		}
		.wheel-wrap canvas {
			display: block;
			width: 100%;
			height: 100%;
			border-radius: 50%;
			box-shadow: 0 6px 24px rgba(0,0,0,.3);
		}
		.wheel-arrow {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			pointer-events: none;
			filter: drop-shadow(0 2px 4px rgba(0,0,0,.45));
		}
	</style>
</head>

<body>

	<!-- ====== 돌림판 섹션 ====== -->
	<div class="container mt-4 mb-5">
		<h2>🎡 돌림판 ㅡ 행복해봄봄</h2>

		<!-- 캔버스 & 버튼 -->
		<div class="d-flex flex-column align-items-center">

			<!-- 판(고정) + 가운데 화살표(회전) -->
			<div class="wheel-wrap">
				<canvas id="wheelCanvas"></canvas>
				<!-- 화살표 (viewBox = 판 좌표 600×600) -->
				<svg class="wheel-arrow" viewBox="0 0 600 600">
					<g id="wheelArrow">
						<path d="M300 150 L326 212 L307 203 L307 342 L293 342 L293 203 L274 212 Z"
						      fill="#dc3545" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
					</g>
					<circle cx="300" cy="300" r="26" fill="#fff" stroke="#bbb" stroke-width="4"/>
					<circle cx="300" cy="300" r="9" fill="#555"/>
				</svg>
			</div>

			<button id="spinBtn" class="btn btn-success btn-lg mt-4 px-5 py-2"
			        onclick="spinWheel()" disabled>
				🎰 돌리기!
			</button>

			<div id="wheelResult" class="mt-3" style="min-height:72px; text-align:center; display:none;"></div>
		</div>
	</div>

	<!-- ====== 결과 모달 ====== -->
	<div class="modal fade" id="resultModal" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-body text-center py-5 px-4" id="resultModalBody">
					<div style="font-size:3.8rem; line-height:1; filter:drop-shadow(0 2px 6px rgba(0,0,0,.3));">🎉</div>
					<div style="font-size:0.95rem; color:rgba(255,255,255,0.75); margin-top:16px;
					            letter-spacing:4px; font-weight:500; text-transform:uppercase;">
						당 첨
					</div>
					<div id="resultModalText"
					     style="font-size:2.4rem; font-weight:bold; color:#fff;
					            margin-top:10px; text-shadow:0 3px 14px rgba(0,0,0,.4); word-break:keep-all;">
					</div>
					<button class="btn btn-light mt-5 px-5 py-2"
					        style="border-radius:50px; font-size:1rem; font-weight:600; opacity:.92;"
					        data-bs-dismiss="modal">
						확인
					</button>
				</div>
			</div>
		</div>
	</div>

	<!-- ====== 돌림판 스크립트 ====== -->
	<script>
		/* ── 상태 변수 ── */
		let wAngle    = 0;   // 화살표 각도 (12시 기준 시계방향, 라디안)
		let wSpinning = false;

		/* ── 칸 목록 (0번이 12시, 시계방향) ── label: 판 글귀(줄 단위), question: 팝업 질문 ── */
		const W_ITEMS = [
			{ color: '#5E8FB5', label: ['신심의', '좋은 점'],   question: '신심을 하면 좋은 점은?' },          // 더스티 블루
			{ color: '#5D9E73', label: ['올해', '아쉬운 일'],   question: '올해 아쉬운 일이 있을까요?' },      // 세이지 그린
			{ color: '#B06060', label: ['최근 들은', '칭찬'],   question: '최근에 들었던 칭찬 한 가지' },      // 소프트 레드
			{ color: '#8A6AAE', label: ['2027년', '목표'],      question: '2027년 원단 목표 1가지' },          // 라벤더 퍼플
			{ color: '#3D9B9B', label: ['올해 체험/', '에피소드'], question: '올해 미니 체험담 또는 에피소드' }, // 뮤트 틸
			{ color: '#B87C3A', label: ['일만청년', '근행회란?'], question: '일만청년근행회란?' },             // 웜 앰버
			{ color: '#5568A8', label: ['신·행·학', '중 최애'], question: '신·행·학 중 가장 좋아하는 것은?' }, // 슬레이트 블루
			{ color: '#A85878', label: ['신조어', '맞히기'],    question: '신조어 뜻 맞히기' },                // 모브 핑크
			{ color: '#729B30', label: ['나의', '인간혁명'],    question: '나의 인간혁명 1가지 소개' },        // 올리브 그린
		];

		/* 판 치수 (논리 px, 화살표 SVG viewBox와 같음) */
		const W_SIZE     = 600;
		const W_R        = 292;   // 칸 반지름
		const W_TEXT_IN  = 162;   // 글귀 안쪽 한계 (화살표 끝 150 + 여유)
		const W_TEXT_OUT = 280;   // 글귀 바깥 한계
		const W_TEXT_PAD = 8;     // 칸 경계선과 글귀 사이 여백
		const W_FONT_MAX = 32;
		const W_LINE_H   = 1.2;

		/* ── 돌림판 구성 ── */
		function setupWheel() {
			/* 글꼴 로드 후 그리기 (판은 한 번만 그리므로 기본 글꼴로 굳지 않게) */
			document.fonts.load(labelFont(W_FONT_MAX)).then(() => {
				drawWheel();
				document.getElementById('spinBtn').disabled = false;
			});
		}

		function labelFont(size) {
			return `bold ${size}px 'SB_Gothic', Arial, sans-serif`;
		}

		/* ── 캔버스 그리기 (판 고정) ── */
		function drawWheel() {
			const canvas = document.getElementById('wheelCanvas');
			const dpr    = window.devicePixelRatio;
			canvas.width  = W_SIZE * dpr;
			canvas.height = W_SIZE * dpr;

			const ctx   = canvas.getContext('2d');
			const c     = W_SIZE / 2;
			const n     = W_ITEMS.length;
			const slice = (2 * Math.PI) / n;
			ctx.scale(dpr, dpr);

			/* 바깥 테두리 원 */
			ctx.beginPath();
			ctx.arc(c, c, W_R + 6, 0, 2 * Math.PI);
			ctx.fillStyle = '#2c2c2c';
			ctx.fill();

			/* 칸 그리기 (i번 칸 중심 = 12시에서 i × slice) */
			W_ITEMS.forEach((item, i) => {
				const sa = i * slice - slice / 2 - Math.PI / 2;
				ctx.beginPath();
				ctx.moveTo(c, c);
				ctx.arc(c, c, W_R, sa, sa + slice);
				ctx.closePath();
				ctx.fillStyle = item.color;
				ctx.fill();
				ctx.strokeStyle = 'rgba(255,255,255,.75)';
				ctx.lineWidth = 2;
				ctx.stroke();
			});

			/* 글귀 (가로쓰기, 전 칸 같은 글자 크기) */
			const fit = fitLabels(ctx, slice);
			const lh  = fit.size * W_LINE_H;
			ctx.font         = labelFont(fit.size);
			ctx.textAlign    = 'center';
			ctx.textBaseline = 'middle';
			ctx.fillStyle    = '#fff';
			ctx.shadowColor  = 'rgba(0,0,0,.65)';
			ctx.shadowBlur   = 4;
			W_ITEMS.forEach((item, i) => {
				const x = c + fit.dist[i] * Math.sin(i * slice);
				const y = c - fit.dist[i] * Math.cos(i * slice);
				item.label.forEach((line, k) => {
					ctx.fillText(line, x, y + (k - (item.label.length - 1) / 2) * lh);
				});
			});
		}

		/* 모든 글귀가 칸 안에 드는 가장 큰 글자 크기 + 칸별 글귀 중심 거리 */
		function fitLabels(ctx, slice) {
			for (let size = W_FONT_MAX; ; size--) {
				ctx.font = labelFont(size);
				const dist = W_ITEMS.map((item, i) => {
					const w  = Math.max(...item.label.map(s => ctx.measureText(s).width));
					const h  = item.label.length * size * W_LINE_H;
					const ok = [];
					for (let d = W_TEXT_IN; d <= W_TEXT_OUT; d++) {
						if (boxFits(i * slice, slice / 2, d, w, h)) {
							ok.push(d);
						}
					}
					return ok.length ? (ok[0] + ok[ok.length - 1]) / 2 : null;   // 들어가는 구간의 가운데
				});
				if (dist.every(d => d !== null)) {
					return { size, dist };
				}
			}
		}

		/* 글귀 상자(w×h)를 칸 중심선 위 거리 d에 놓을 때 칸 안에 드는지 */
		function boxFits(th, half, d, w, h) {
			const x0 = d * Math.sin(th) - w / 2, x1 = x0 + w;
			const y0 = -d * Math.cos(th) - h / 2, y1 = y0 + h;

			/* 안쪽: 상자에서 판 중심과 가장 가까운 점이 화살표 끝 밖 */
			const near = Math.hypot(Math.min(Math.max(0, x0), x1), Math.min(Math.max(0, y0), y1));

			/* 바깥·양옆: 네 모서리가 테두리 안, 칸 경계선에서 여백 이상 */
			return near >= W_TEXT_IN && [[x0, y0], [x1, y0], [x1, y1], [x0, y1]].every(([x, y]) => {
				const r   = Math.hypot(x, y);
				const off = Math.atan2(x, -y) - th;
				const gap = r * Math.sin(half - Math.abs(Math.atan2(Math.sin(off), Math.cos(off))));
				return r <= W_TEXT_OUT && gap >= W_TEXT_PAD;
			});
		}

		/* 화살표 회전 */
		function drawArrow(angle) {
			document.getElementById('wheelArrow').setAttribute('transform', `rotate(${angle * 180 / Math.PI} 300 300)`);
		}

		/* ── 돌리기 (가운데 화살표 회전) ── */
		function spinWheel() {
			if (wSpinning) return;
			wSpinning = true;

			const btn = document.getElementById('spinBtn');
			btn.disabled = true;
			btn.textContent = '🔄 돌리는 중…';
			document.getElementById('wheelResult').innerHTML = '';

			const extra  = (Math.random() * 8 + 5) * 2 * Math.PI; // 5~13 바퀴
			const target = wAngle + extra;
			const dur    = 3500 + Math.random() * 2000;            // 3.5~5.5 초
			const t0     = performance.now();
			const a0     = wAngle;

			(function loop(now) {
				const p = Math.min((now - t0) / dur, 1);
				const e = 1 - Math.pow(1 - p, 4);   // ease-out quart
				wAngle  = a0 + (target - a0) * e;
				drawArrow(wAngle);

				if (p < 1) {
					requestAnimationFrame(loop);
				} else {
					wAngle    = target;
					wSpinning = false;
					drawArrow(wAngle);
					btn.disabled    = false;
					btn.textContent = '🎰 돌리기!';
					showWheelResult();
				}
			})(performance.now());
		}

		/* ── 결과 표시 (모달) ── */
		function showWheelResult() {
			const n     = W_ITEMS.length;
			const slice = (2 * Math.PI) / n;
			const norm  = ((wAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
			const idx   = Math.floor((norm + slice / 2) / slice) % n;   // 칸 중심이 i × slice이므로 반 칸 보정

			const item  = W_ITEMS[idx];
			const light = lightenColor(item.color, 38);

			const body = document.getElementById('resultModalBody');
			body.style.background = `linear-gradient(145deg, ${light} 0%, ${item.color} 100%)`;
			document.getElementById('resultModalText').textContent = item.question;

			new bootstrap.Modal(document.getElementById('resultModal')).show();
		}

		/* hex 색상을 amt 만큼 밝게 */
		function lightenColor(hex, amt) {
			const n = parseInt(hex.slice(1), 16);
			const r = Math.min(255, (n >> 16 & 255) + amt);
			const g = Math.min(255, (n >>  8 & 255) + amt);
			const b = Math.min(255, (n       & 255) + amt);
			return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
		}
	</script>
</body>
</html>
