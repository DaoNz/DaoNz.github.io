<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>행복톡톡 이야기</title>

	<!-- Bootstrap v5.3.3 Dist -->
	<link href="/assets/Bootstrap/css/bootstrap.css" rel="stylesheet">
	<script src="/assets/Bootstrap/js/bootstrap.js"></script>

	<!-- 제목·질문 글꼴 (Jua) -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

	<script>
		window.onload = () => {
			setupWheel();
		};
	</script>
	
	<style>
		@font-face {
			font-family: 'SB_Gothic';
			src: url('/assets/fonts/SB_Gothic.ttf') format('truetype');
		}
		:root {
			--bg:         #E7ECFF;   /* 안개 하늘 */
			--dot:        #CBD4F6;   /* 바탕 점 */
			--ink:        #1F2547;   /* 잉크 남색 (글자·테두리·그림자) */
			--accent:     #FF6B5B;   /* 톡 코랄 (채움) */
			--accent-ink: #E2483A;   /* 톡 코랄 (글자) */
			--paper:      #FFFFFF;
		}
		body {
			font-family: SB_Gothic;
			color: var(--ink);
			background: radial-gradient(circle, var(--dot) 1.5px, transparent 1.6px) 0 0 / 22px 22px var(--bg);
		}

		/* 한 화면: 제목 → 판 → 버튼 */
		.stage {
			min-height: 100svh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: clamp(16px, 3vh, 28px);
			padding: 24px 16px 32px;
		}
		.title {
			margin: 0;
			font-family: 'Jua', SB_Gothic, sans-serif;
			font-size: clamp(2.2rem, 7vw, 3.4rem);
			font-weight: 400;
			line-height: 1;
		}
		.title span { color: var(--accent-ink); }

		/* 판 + 가운데 화살표 (화면 높이에도 맞춤) */
		.wheel-wrap {
			position: relative;
			width: min(600px, 92vw, 100svh - 232px);
			aspect-ratio: 1;
		}
		.wheel-wrap canvas {
			display: block;
			width: 100%;
			height: 100%;
			filter: drop-shadow(7px 9px 0 var(--ink));   /* box-shadow는 원 가장자리에 틈이 보여서 */
		}
		.wheel-arrow {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			pointer-events: none;
			filter: drop-shadow(3px 4px 0 rgba(31,37,71,.3));
		}

		.spin-btn {
			padding: 12px 64px;
			font-size: 1.4rem;
			font-weight: bold;
			color: var(--ink);
			background: var(--accent);
			border: 3px solid var(--ink);
			border-radius: 999px;
			box-shadow: 4px 5px 0 var(--ink);
			transition: transform .08s, box-shadow .08s;
		}
		.spin-btn:hover:not(:disabled)  { transform: translate(-1px, -1px); box-shadow: 5px 6px 0 var(--ink); }
		.spin-btn:active:not(:disabled) { transform: translate(3px, 4px);   box-shadow: 1px 1px 0 var(--ink); }
		.spin-btn:disabled              { opacity: .6; }
		.spin-btn:focus-visible         { outline: 3px solid var(--accent-ink); outline-offset: 4px; }

		/* 결과 모달 팝 애니메이션 */
		@keyframes resultPop {
			0%   { transform: scale(0.2) rotate(-5deg); opacity: 0; }
			60%  { transform: scale(1.08) rotate(2deg);  opacity: 1; }
			80%  { transform: scale(0.96) rotate(-1deg); }
			100% { transform: scale(1)    rotate(0deg);  opacity: 1; }
		}
		#resultModal .modal-dialog { transition: none; }
		#resultModal.show .modal-dialog {
			transform-origin: 25% 100%;
			animation: resultPop 0.52s cubic-bezier(0.34, 1.56, 0.64, 1) both;
		}
		#resultModal .modal-content {
			background: transparent;
			border: none;
		}
		.modal-backdrop {
			--bs-backdrop-bg: var(--ink);
			--bs-backdrop-opacity: .55;
		}

		/* 결과 말풍선 (--bubble = 당첨 칸 색) */
		.bubble {
			position: relative;
			margin: 0 10px 30px 0;   /* 오른쪽·아래: 그림자·꼬리 자리 */
			padding: 34px 28px 30px;
			text-align: center;
			background: var(--bubble);
			border: 3px solid var(--ink);
			border-radius: 32px;
			box-shadow: 7px 9px 0 var(--ink);
		}
		/* 꼬리 (테두리 삼각형 위에 바탕 삼각형) */
		.bubble::before,
		.bubble::after {
			content: '';
			position: absolute;
			border-style: solid;
			border-color: var(--ink) transparent transparent;
		}
		.bubble::before { left: 22%; bottom: -30px; border-width: 30px 26px 0 0; }
		.bubble::after  { left: calc(22% + 3px); bottom: -22px; border-width: 22px 19px 0 0; border-top-color: var(--bubble); }
		.bubble-tag {
			display: inline-block;
			padding: 5px 16px;
			font-size: 1.05rem;
			background: var(--paper);
			border: 2px solid var(--ink);
			border-radius: 999px;
		}
		.bubble-question {
			margin-top: 18px;
			font-family: 'Jua', SB_Gothic, sans-serif;
			font-size: clamp(1.9rem, 6vw, 2.6rem);
			line-height: 1.25;
			word-break: keep-all;
		}
		.bubble-close {
			margin-top: 28px;
			padding: 8px 44px;
			font-size: 1rem;
			color: var(--paper);
			background: var(--ink);
			border: none;
			border-radius: 999px;
		}
		.bubble-close:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

		@media (prefers-reduced-motion: reduce) {
			#resultModal.show .modal-dialog { animation: none; }
		}
	</style>
</head>

<body>

	<!-- ====== 돌림판 섹션 ====== -->
	<main class="stage">
		<h1 class="title">행복<span>톡톡</span> 이야기</h1>

		<!-- 판(고정) + 가운데 화살표(회전) -->
		<div class="wheel-wrap">
			<canvas id="wheelCanvas"></canvas>
			<!-- 화살표 (viewBox = 판 좌표 600×600) -->
			<svg class="wheel-arrow" viewBox="0 0 600 600">
				<g id="wheelArrow">
					<path d="M300 146 L330 214 L309 205 L309 346 L291 346 L291 205 L270 214 Z"
					      fill="#1F2547" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
				</g>
				<circle cx="300" cy="300" r="30" fill="#fff" stroke="#1F2547" stroke-width="5"/>
				<circle cx="300" cy="300" r="10" fill="#FF6B5B"/>
			</svg>
		</div>

		<button id="spinBtn" class="spin-btn" onclick="spinWheel()" disabled>돌리기</button>
	</main>

	<!-- ====== 결과 모달 (말풍선) ====== -->
	<div class="modal fade" id="resultModal" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="bubble" id="resultBubble">
					<div class="bubble-tag" id="resultTag"></div>
					<div class="bubble-question" id="resultQuestion"></div>
					<button class="bubble-close" data-bs-dismiss="modal">닫기</button>
				</div>
			</div>
		</div>
	</div>

	<!-- ====== 돌림판 스크립트 ====== -->
	<script>
		/* ── 상태 변수 ── */
		let wAngle    = 0;   // 화살표 각도 (12시 기준 시계방향, 라디안)
		let wSpinning = false;

		/* ── 칸 목록 (0번이 12시, 시계방향) ── label: 칸 이름, lines: 판에 쓰는 줄, question: 말풍선 질문 ── */
		const W_ITEMS = [
			{ color: '#FFB3A7', label: '신심의 좋은 점',     lines: ['신심의', '좋은 점'],     question: '신심을 하면 좋은 점은?' },          // 연어
			{ color: '#FFE08A', label: '올해 아쉬운 일',     lines: ['올해', '아쉬운 일'],     question: '올해 아쉬운 일이 있을까요?' },      // 버터
			{ color: '#A6E3C4', label: '최근 들은 칭찬',     lines: ['최근 들은', '칭찬'],     question: '최근에 들었던 칭찬 한 가지' },      // 민트
			{ color: '#A9CCFF', label: '2027년 목표',        lines: ['2027년', '목표'],        question: '2027년 원단 목표 1가지' },          // 하늘
			{ color: '#D3BDFF', label: '올해 체험/에피소드', lines: ['올해 체험/', '에피소드'], question: '올해 미니 체험담 또는 에피소드' }, // 라벤더
			{ color: '#FFC59A', label: '일만청년근행회란?',  lines: ['일만청년', '근행회란?'], question: '일만청년근행회란?' },             // 살구
			{ color: '#9EE0E6', label: '신·행·학 중 최애',   lines: ['신·행·학', '중 최애'],   question: '신·행·학 중 가장 좋아하는 것은?' }, // 아쿠아
			{ color: '#FFADD2', label: '신조어 맞히기',      lines: ['신조어', '맞히기'],      question: '신조어 뜻 맞히기' },                // 분홍
			{ color: '#C8E89A', label: '나의 인간혁명',      lines: ['나의', '인간혁명'],      question: '나의 인간혁명 1가지 소개' },        // 연두
		];

		/* 판 치수 (논리 px, 화살표 SVG viewBox와 같음) */
		const W_SIZE     = 600;
		const W_R        = 292;   // 칸 반지름
		const W_TEXT_IN  = 164;   // 글귀 안쪽 한계 (화살표 끝 154 + 여유)
		const W_TEXT_OUT = 280;   // 글귀 바깥 한계
		const W_TEXT_PAD = 8;     // 칸 경계선과 글귀 사이 여백
		const W_FONT_MAX = 32;
		const W_LINE_H   = 1.2;
		const W_INK      = '#1F2547';   // CSS --ink 와 같은 값 (캔버스는 CSS 변수를 못 씀)

		/* ── 돌림판 구성 ── */
		function setupWheel() {
			/* 글꼴 로드 후 그리기 (판은 한 번만 그리므로 기본 글꼴로 굳지 않게) */
			document.fonts.load(labelFont(W_FONT_MAX)).then(() => {
				drawWheel();
				document.getElementById('spinBtn').disabled = false;
			});
		}

		function labelFont(size) {
			return `bold ${size}px 'SB_Gothic', Arial, sans-serif`;
		}

		/* ── 캔버스 그리기 (판 고정) ── */
		function drawWheel() {
			const canvas = document.getElementById('wheelCanvas');
			const dpr    = window.devicePixelRatio;
			canvas.width  = W_SIZE * dpr;
			canvas.height = W_SIZE * dpr;

			const ctx   = canvas.getContext('2d');
			const c     = W_SIZE / 2;
			const n     = W_ITEMS.length;
			const slice = (2 * Math.PI) / n;
			ctx.scale(dpr, dpr);

			/* 바깥 테두리 원 */
			ctx.beginPath();
			ctx.arc(c, c, c, 0, 2 * Math.PI);
			ctx.fillStyle = W_INK;
			ctx.fill();

			/* 칸 그리기 (i번 칸 중심 = 12시에서 i × slice) */
			W_ITEMS.forEach((item, i) => {
				const sa = i * slice - slice / 2 - Math.PI / 2;
				ctx.beginPath();
				ctx.moveTo(c, c);
				ctx.arc(c, c, W_R, sa, sa + slice);
				ctx.closePath();
				ctx.fillStyle = item.color;
				ctx.fill();
				ctx.strokeStyle = W_INK;
				ctx.lineWidth   = 3;
				ctx.lineJoin    = 'round';
				ctx.stroke();
			});

			/* 글귀 (가로쓰기, 전 칸 같은 글자 크기) */
			const fit = fitLabels(ctx, slice);
			const lh  = fit.size * W_LINE_H;
			ctx.font         = labelFont(fit.size);
			ctx.textAlign    = 'center';
			ctx.textBaseline = 'middle';
			ctx.fillStyle    = W_INK;
			W_ITEMS.forEach((item, i) => {
				const x = c + fit.dist[i] * Math.sin(i * slice);
				const y = c - fit.dist[i] * Math.cos(i * slice);
				item.lines.forEach((line, k) => {
					ctx.fillText(line, x, y + (k - (item.lines.length - 1) / 2) * lh);
				});
			});
		}

		/* 모든 글귀가 칸 안에 드는 가장 큰 글자 크기 + 칸별 글귀 중심 거리 */
		function fitLabels(ctx, slice) {
			for (let size = W_FONT_MAX; ; size--) {
				ctx.font = labelFont(size);
				const dist = W_ITEMS.map((item, i) => {
					const w  = Math.max(...item.lines.map(s => ctx.measureText(s).width));
					const h  = item.lines.length * size * W_LINE_H;
					const ok = [];
					for (let d = W_TEXT_IN; d <= W_TEXT_OUT; d++) {
						if (boxFits(i * slice, slice / 2, d, w, h)) {
							ok.push(d);
						}
					}
					return ok.length ? (ok[0] + ok[ok.length - 1]) / 2 : null;   // 들어가는 구간의 가운데
				});
				if (dist.every(d => d !== null)) {
					return { size, dist };
				}
			}
		}

		/* 글귀 상자(w×h)를 칸 중심선 위 거리 d에 놓을 때 칸 안에 드는지 */
		function boxFits(th, half, d, w, h) {
			const x0 = d * Math.sin(th) - w / 2, x1 = x0 + w;
			const y0 = -d * Math.cos(th) - h / 2, y1 = y0 + h;

			/* 안쪽: 상자에서 판 중심과 가장 가까운 점이 화살표 끝 밖 */
			const near = Math.hypot(Math.min(Math.max(0, x0), x1), Math.min(Math.max(0, y0), y1));

			/* 바깥·양옆: 네 모서리가 테두리 안, 칸 경계선에서 여백 이상 */
			return near >= W_TEXT_IN && [[x0, y0], [x1, y0], [x1, y1], [x0, y1]].every(([x, y]) => {
				const r   = Math.hypot(x, y);
				const off = Math.atan2(x, -y) - th;
				const gap = r * Math.sin(half - Math.abs(Math.atan2(Math.sin(off), Math.cos(off))));
				return r <= W_TEXT_OUT && gap >= W_TEXT_PAD;
			});
		}

		/* 화살표 회전 */
		function drawArrow(angle) {
			document.getElementById('wheelArrow').setAttribute('transform', `rotate(${angle * 180 / Math.PI} 300 300)`);
		}

		/* ── 돌리기 (가운데 화살표 회전) ── */
		function spinWheel() {
			if (wSpinning) return;
			wSpinning = true;

			const btn = document.getElementById('spinBtn');
			btn.disabled = true;
			btn.textContent = '돌아가는 중…';

			const extra  = (Math.random() * 8 + 5) * 2 * Math.PI; // 5~13 바퀴
			const target = wAngle + extra;
			const dur    = 3500 + Math.random() * 2000;            // 3.5~5.5 초
			const t0     = performance.now();
			const a0     = wAngle;

			(function loop(now) {
				const p = Math.min((now - t0) / dur, 1);
				const e = 1 - Math.pow(1 - p, 4);   // ease-out quart
				wAngle  = a0 + (target - a0) * e;
				drawArrow(wAngle);

				if (p < 1) {
					requestAnimationFrame(loop);
				} else {
					wAngle    = target;
					wSpinning = false;
					drawArrow(wAngle);
					btn.disabled    = false;
					btn.textContent = '돌리기';
					showWheelResult();
				}
			})(performance.now());
		}

		/* ── 결과 표시 (말풍선 모달) ── */
		function showWheelResult() {
			const n     = W_ITEMS.length;
			const slice = (2 * Math.PI) / n;
			const norm  = ((wAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
			const idx   = Math.floor((norm + slice / 2) / slice) % n;   // 칸 중심이 i × slice이므로 반 칸 보정

			const item = W_ITEMS[idx];
			document.getElementById('resultBubble').style.setProperty('--bubble', item.color);
			document.getElementById('resultTag').textContent      = item.label;
			document.getElementById('resultQuestion').textContent = item.question;

			new bootstrap.Modal(document.getElementById('resultModal')).show();
		}
	</script>
</body>
</html>
